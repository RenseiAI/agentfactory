name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on the merge queue's merge_group ref so the required checks
  # (Build, Test, Typecheck, Quality Ratchet, Secret Scan) report against it.
  # Without this the queue sits in AWAITING_CHECKS forever and no PR can merge.
  merge_group:
  workflow_call:

# Default-deny: every job gets a read-only GITHUB_TOKEN unless it
# explicitly asks for more.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write # gitleaks-action posts PR comments on findings
    steps:
      - uses: actions/checkout@v7
        # gitleaks-action errors on the merge_group event ("not yet supported").
        # It already scanned the PR's commits on pull_request, so skip here — the
        # Secret Scan job still reports success so the merge queue can proceed.
        if: ${{ env.GITLEAKS_LICENSE != '' && github.event_name != 'merge_group' }}
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        # gitleaks-action errors on the merge_group event ("not yet supported").
        # It already scanned the PR's commits on pull_request, so skip here — the
        # Secret Scan job still reports success so the merge queue can proceed.
        if: ${{ env.GITLEAKS_LICENSE != '' && github.event_name != 'merge_group' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  license-check:
    name: License Compliance
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check dependency licenses
        run: >-
          npx license-checker-rseidelsohn
          --production
          --onlyAllow "$(cat .license-allowlist)"
          --excludePrivatePackages
          --excludePackages "@anthropic-ai/claude-agent-sdk"

  fossa-analyze:
    name: FOSSA Analyze
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.FOSSA_API_KEY != '' }}

      - uses: fossas/fossa-action@main
        if: ${{ env.FOSSA_API_KEY != '' }}
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  fossa-test:
    name: FOSSA Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [fossa-analyze]
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.FOSSA_API_KEY != '' }}

      - uses: fossas/fossa-action@main
        if: ${{ env.FOSSA_API_KEY != '' }}
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

  fossa-sbom:
    name: FOSSA SBOM Generation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [fossa-analyze]
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.FOSSA_API_KEY != '' }}

      - name: Install FOSSA CLI
        if: ${{ env.FOSSA_API_KEY != '' }}
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash

      - name: Generate SPDX SBOM
        if: ${{ env.FOSSA_API_KEY != '' }}
        run: fossa report attribution --format spdx --project donmai-libraries > sbom-spdx.json

      - name: Generate CycloneDX SBOM
        if: ${{ env.FOSSA_API_KEY != '' }}
        run: fossa report attribution --format cyclonedx --project donmai-libraries > sbom-cyclonedx.json

      - name: Generate attribution document
        if: ${{ env.FOSSA_API_KEY != '' }}
        run: fossa report attribution --project donmai-libraries > NOTICE

      - name: Upload SBOM artifacts
        if: ${{ env.FOSSA_API_KEY != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-and-notices
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
            NOTICE

  typecheck:
    name: Typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # No test artifacts, RENSEI_ env names, or private references in
      # anything `pnpm publish` would ship.
      - name: Check publish surface
        run: bash scripts/check-publish-surface.sh

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build]
    services:
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Scope NODE_OPTIONS to the test step only. Setting it at the job level
      # leaks --experimental-sqlite into pnpm/action-setup's self-installer,
      # which runs on the runner's system node and rejects the flag
      # ("--experimental-sqlite is not allowed in NODE_OPTIONS", exit 9).
      # By this step setup-node has installed Node 22, which accepts it.
      - run: pnpm test
        env:
          NODE_OPTIONS: --experimental-sqlite
          REDIS_URL: redis://127.0.0.1:6379

  quality-ratchet:
    name: Quality Ratchet
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build]
    services:
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Check if quality ratchet is configured
        id: ratchet-check
        run: |
          if [ -f .donmai/quality-ratchet.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Quality ratchet not configured — skipping"
          fi

      - uses: pnpm/action-setup@v6.0.9
        if: steps.ratchet-check.outputs.exists == 'true'

      - uses: actions/setup-node@v7
        if: steps.ratchet-check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.ratchet-check.outputs.exists == 'true'
      - run: pnpm build
        if: steps.ratchet-check.outputs.exists == 'true'

      - name: Check quality ratchet
        if: steps.ratchet-check.outputs.exists == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          set +e

          # Run typecheck, count errors
          pnpm typecheck 2> typecheck-stderr.txt
          TYPECHECK_EXIT=$?
          TYPECHECK_ERRORS=$(grep -c 'error TS' typecheck-stderr.txt 2>/dev/null || echo 0)

          # Run tests with JSON reporter for counts
          pnpm test -- --reporter=json > test-results.json 2>&1
          TEST_EXIT=$?

          # Parse test results
          TEST_TOTAL=$(node -e "try { const r=require('./test-results.json'); console.log(r.numTotalTests || 0) } catch { console.log(0) }" 2>/dev/null || echo 0)
          TEST_FAILED=$(node -e "try { const r=require('./test-results.json'); console.log(r.numFailedTests || 0) } catch { console.log(0) }" 2>/dev/null || echo 0)

          # Load ratchet thresholds
          MIN_TESTS=$(node -e "const r=JSON.parse(require('fs').readFileSync('.donmai/quality-ratchet.json','utf8')); console.log(r.thresholds.testCount.min)")
          MAX_FAILURES=$(node -e "const r=JSON.parse(require('fs').readFileSync('.donmai/quality-ratchet.json','utf8')); console.log(r.thresholds.testFailures.max)")
          MAX_TYPE_ERRORS=$(node -e "const r=JSON.parse(require('fs').readFileSync('.donmai/quality-ratchet.json','utf8')); console.log(r.thresholds.typecheckErrors.max)")

          echo "Test count: $TEST_TOTAL (min: $MIN_TESTS)"
          echo "Test failures: $TEST_FAILED (max: $MAX_FAILURES)"
          echo "Typecheck errors: $TYPECHECK_ERRORS (max: $MAX_TYPE_ERRORS)"

          FAILED=0
          if [ "$TEST_TOTAL" -lt "$MIN_TESTS" ]; then
            echo "::error::RATCHET VIOLATION: Test count $TEST_TOTAL < minimum $MIN_TESTS"
            FAILED=1
          fi
          if [ "$TEST_FAILED" -gt "$MAX_FAILURES" ]; then
            echo "::error::RATCHET VIOLATION: Test failures $TEST_FAILED > maximum $MAX_FAILURES"
            FAILED=1
          fi
          if [ "$TYPECHECK_ERRORS" -gt "$MAX_TYPE_ERRORS" ]; then
            echo "::error::RATCHET VIOLATION: Typecheck errors $TYPECHECK_ERRORS > maximum $MAX_TYPE_ERRORS"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "Quality ratchet check passed"
